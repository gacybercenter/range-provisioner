# JINJA Variables
{% set systems = 2 %}
{% set organization = "organization" %}

# Stacks
stacks:
  - {{ organization }}

# Groups
groups:
  {{ organization }}:
    parent: ROOT
    attributes:
      max-connections: 10

# Connection Templates
connectionTemplates:
  {{ organization }}.screen.server:
    parent: {{ organization }}
    pattern: {{ organization }}.kali.(\d+)
    parameters:
      username: user
      password: password

# Users
users:
  {% for system in range(1, systems+1) %}
  {{ organization }}.user.{{ system }}:
    username: {{ organization }}.kali.{{ system }}
    password: P@ssw0rd
    permissions:
      connectionPermissions:
        - {{ organization }}.kali.{{ system }}
  {% endfor %}
