# JINJA Variables
{% set systems = 4 %}
{% set organization = "automation" %}

# Stacks
stacks:
  - {{ organization }}

# Groups
groups:
  {{ organization }}:
    parent: ROOT
    attributes:
      max-connections: 10

# Specific Connection Templates
connectionTemplates:
  {{ organization }}.screen.server:
    parent: {{ organization }}
    pattern: {{ organization }}.screen.server.(\d+)
    protocol: rdp
    parameters:
      port: 3389
      security: any
      ignore-cert: 'true'
      username: gacyberrange
      password: gacyberrange

# USERS
users:
  {% for system in range(1, systems+1) %}
  {{ organization }}.user.{{ system }}:
    username: {{ organization }}.screen.{{ system }}
    password: P@ssw0rd{{ system }}!
    permissions:
      connectionPermissions:
        - {{ organization }}.screen.server.{{ system }}
  {% endfor %}